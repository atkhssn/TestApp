name: Build, Package, Release & Publish

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]

permissions:
  contents: write

env:
  APP_NAME: TestApp
  PROJECT_PATH: src/TestApp/TestApp.csproj
  PUBLISH_REL_PATH: src/TestApp/bin/Release/net9.0-windows/win-x64/publish

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.getver.outputs.version }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Compute version
        id: getver
        shell: pwsh
        run: |
          $ref = "${{ github.ref_name }}"
          if ($ref -and ($ref -match '^v\d+\.\d+\.\d+$')) {
            Write-Output "version=$($ref.TrimStart('v'))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            $short = "${{ github.sha }}".Substring(0,7)
            Write-Output "version=0.0.0-$short" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Restore + Publish (self-contained single file with version)
        shell: pwsh
        run: |
          dotnet restore $env:PROJECT_PATH -r win-x64
          dotnet publish $env:PROJECT_PATH `
            -c Release `
            -r win-x64 `
            --self-contained true `
            /p:PublishSingleFile=true `
            /p:PublishTrimmed=false `
            /p:Version=${{ steps.getver.outputs.version }}

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $publish = Join-Path $PWD "${{ env.PUBLISH_REL_PATH }}"
          if (-not (Test-Path $publish)) {
            Write-Error "Publish folder not found: $publish"
            exit 1
          }
          & iscc.exe "installer\Setup.iss" /DMyAppVersion="${{ steps.getver.outputs.version }}" /DSourceDir="$publish"

      - name: Upload artifacts (installer + publish)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ steps.getver.outputs.version }}
          path: |
            installer/dist/*.exe
            ${{ env.PUBLISH_REL_PATH }}\**

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - name: Checkout repo (main branch)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.exe
          generate_release_notes: true

      - name: Prepare update folder (xml + html + exe)
        shell: pwsh
        run: |
          $version = '${{ needs.build.outputs.version }}'
          $tag = '${{ github.ref_name }}'
          $repo = '${{ github.repository }}'
          $repoOwner = $repo.Split('/')[0]
          $repoName = $repo.Split('/')[1]

          if ($version.Split('.').Count -lt 4) { $version = "$version.0" }

          $installerName = "${{ env.APP_NAME }}-Setup-$version.exe"
          $url = "https://$repoOwner.github.io/$repoName/$installerName"
          $changelog = "https://github.com/$repo/releases/tag/$tag"

          $updateFolder = "update"
          New-Item -ItemType Directory -Force -Path $updateFolder | Out-Null
          $file = "$updateFolder/updates.xml"

          # --- Load existing XML or create new
          if (Test-Path $file) {
              [xml]$doc = Get-Content $file
              $root = $doc.SelectSingleNode('/updates')
              if (-not $root) { $root = $doc.DocumentElement }
          } else {
              $doc = New-Object System.Xml.XmlDocument
              $xmlDecl = $doc.CreateXmlDeclaration("1.0","UTF-8",$null)
              $doc.AppendChild($xmlDecl) | Out-Null
              $root = $doc.CreateElement("updates")
              $doc.AppendChild($root) | Out-Null
          }

          # --- Create new <item>
          $item = $doc.CreateElement("item")
          $ver = $doc.CreateElement("version"); $ver.InnerText = $version; $item.AppendChild($ver) | Out-Null
          $urln = $doc.CreateElement("url"); $urln.InnerText = $url; $item.AppendChild($urln) | Out-Null
          $chg = $doc.CreateElement("changelog"); $chg.InnerText = $changelog; $item.AppendChild($chg) | Out-Null
          $mand = $doc.CreateElement("mandatory"); $mand.InnerText = "true"; $item.AppendChild($mand) | Out-Null

          # --- Append new item at the end of XML
          $root.AppendChild($item) | Out-Null

          $doc.Save($file)
          Write-Host "Update metadata written to $file"

          # --- Copy installer to update folder
          $exe = Get-ChildItem -Path "artifacts" -Recurse -Filter "*.exe" | Select-Object -First 1
          if ($exe) { Copy-Item $exe.FullName -Destination "$updateFolder/$installerName" -Force }
          else { Write-Error "No installer exe found"; exit 1 }

          # --- Write index.html
          @'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>TestApp Updates</title>
            <link rel="icon" href="https://github.githubassets.com/favicons/favicon.svg">
            <style>
              body { font-family: Arial, sans-serif; background: #f9fafc; color: #333; margin:0; padding:0; }
              header { background: #0366d6; color: white; padding: 1rem; text-align: center; }
              main { max-width: 900px; margin: 2rem auto; background: white; padding: 2rem;
                    border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
              h1, h2 { margin-top: 0; }
              .download-latest { text-align: center; margin: 2rem 0; }
              .btn { display: inline-block; padding: 0.8rem 1.5rem; background: #28a745; color: white;
                    border-radius: 5px; text-decoration: none; font-weight: bold; font-size: 1.1rem; }
              .btn:hover { background: #218838; }
              table { width: 100%; border-collapse: collapse; margin-top: 2rem; }
              table th, table td { padding: 0.8rem; border-bottom: 1px solid #ddd; text-align: left; }
              table th { background: #f3f3f3; }
              a { color: #0366d6; text-decoration: none; }
              a:hover { text-decoration: underline; }
              footer { text-align: center; padding: 1rem; font-size: 0.9rem; color: #666; margin-top: 2rem; }
            </style>
          </head>
          <body>
            <header>
              <h1>🚀 TestApp Update Server</h1>
            </header>
            <main>
              <h2>Latest Version</h2>
              <div id="latest-download" class="download-latest">
                <p>Loading latest release...</p>
              </div>
              <h2>All Releases</h2>
              <table>
                <thead><tr><th>Version</th><th>Download</th><th>Changelog</th></tr></thead>
                <tbody id="release-list"><tr><td colspan="3">Loading...</td></tr></tbody>
              </table>
            </main>
            <footer>&copy; 2025 TestApp · Updates hosted with GitHub Pages</footer>
            <script>
              document.addEventListener("DOMContentLoaded", () => {
                async function loadUpdates() {
                  try {
                    const response = await fetch("./updates.xml"); // <- add "./"
                    const xmlText = await response.text();
                    const parser = new DOMParser();
                    const xml = parser.parseFromString(xmlText, "application/xml");
                    const items = Array.from(xml.querySelectorAll("updates > item"));
                    if (!items.length) return;

                    items.reverse(); // latest first

                    let rows = "";
                    items.forEach((item, i) => {
                      const version = item.querySelector("version")?.textContent ?? "";
                      const url = item.querySelector("url")?.textContent ?? "#";
                      const changelog = item.querySelector("changelog")?.textContent ?? "#";
                      if (i === 0) {
                        document.getElementById("latest-download").innerHTML =
                          `<a class="btn" href="${url}">⬇ Download TestApp v${version}</a>`;
                      }
                      rows += `<tr><td>v${version}</td><td><a href="${url}">Download</a></td><td><a href="${changelog}">View</a></td></tr>`;
                    });
                    document.getElementById("release-list").innerHTML = rows;
                  } catch (e) {
                    console.error("Failed to load updates.xml:", e);
                  }
                }
                loadUpdates();
              });
            </script>
          </body>
          </html>
          '@ | Out-File -FilePath "$updateFolder/index.html" -Encoding utf8

      - name: Commit & push update folder to main
        uses: EndBug/add-and-commit@v9
        with:
          add: 'update/**'
          message: "Update metadata, installer, and index.html for ${{ needs.build.outputs.version }}"
          push: true
      
      - name: Publish updates.xml + installer + index.html to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./update
          destination_dir: .
