name: Build & Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.getver.outputs.version }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Get version from tag
        id: getver
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $env:GITHUB_OUTPUT

      - name: Restore dependencies
        run: dotnet restore

      - name: Publish app
        run: dotnet publish src/TestApp/TestApp.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeAllContentForSelfExtract=true -p:Version=${{ steps.getver.outputs.version }} -o publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TestApp
          path: publish/**/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - name: Checkout repo (force main branch)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.exe
          generate_release_notes: true

      - name: Generate update metadata
        run: |
          mkdir update
          echo "<?xml version='1.0' encoding='UTF-8'?>" > update/updates.xml
          echo "<item>" >> update/updates.xml
          echo "  <version>${{ needs.build.outputs.version }}</version>" >> update/updates.xml
          echo "  <url>https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/TestApp-Setup-${{ needs.build.outputs.version }}.exe</url>" >> update/updates.xml
          echo "  <changelog>https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}</changelog>" >> update/updates.xml
          echo "</item>" >> update/updates.xml

      - name: Commit and push updates.xml
        uses: EndBug/add-and-commit@v9
        with:
          add: 'update/updates.xml'
          message: "Update metadata for ${{ needs.build.outputs.version }}"
          push: true
