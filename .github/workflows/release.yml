name: Build, Package & Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]

permissions:
  contents: write

env:
  APP_NAME: TestApp
  PROJECT_PATH: src/TestApp/TestApp.csproj
  PUBLISH_REL_PATH: src/TestApp/bin/Release/net9.0-windows/win-x64/publish

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.getver.outputs.version }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Compute version
        id: getver
        shell: pwsh
        run: |
          $ref = "${{ github.ref_name }}"
          if ($ref -and ($ref -match '^v\d+\.\d+\.\d+$')) {
            Write-Output "version=$($ref.TrimStart('v'))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            $short = "${{ github.sha }}".Substring(0,7)
            Write-Output "version=0.0.0-$short" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Restore + Publish (self-contained single file)
        shell: pwsh
        run: |
          dotnet restore $env:PROJECT_PATH -r win-x64
          dotnet publish $env:PROJECT_PATH `
            -c Release `
            -r win-x64 `
            --self-contained true `
            /p:PublishSingleFile=true `
            /p:PublishTrimmed=false

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $publish = Join-Path $PWD "${{ env.PUBLISH_REL_PATH }}"
          if (-not (Test-Path $publish)) {
            Write-Error "Publish folder not found: $publish"
            exit 1
          }
          & iscc.exe "installer\Setup.iss" /DMyAppVersion="${{ steps.getver.outputs.version }}" /DSourceDir="$publish"

      - name: Upload artifacts (installer + publish)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ steps.getver.outputs.version }}
          path: |
            installer/dist/*.exe
            ${{ env.PUBLISH_REL_PATH }}\**

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - name: Checkout repo (main branch)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.exe
          generate_release_notes: true

      - name: Generate/append update metadata (update/updates.xml)
        shell: pwsh
        run: |
          $version = '${{ needs.build.outputs.version }}'
          $tag = '${{ github.ref_name }}'
          $repo = '${{ github.repository }}'
          $installerName = "${{ env.APP_NAME }}-Setup-$version.exe"
          $url = "https://github.com/$repo/releases/download/$tag/$installerName"
          $changelog = "https://github.com/$repo/releases/tag/$tag"
          $folder = 'update'
          if (-not (Test-Path $folder)) { New-Item -ItemType Directory -Path $folder | Out-Null }
          $file = Join-Path $folder 'updates.xml'
          if (-not (Test-Path $file)) {
            # Create base XML
            "<?xml version='1.0' encoding='UTF-8'?>" | Out-File -FilePath $file -Encoding utf8
            "<updates>" | Add-Content -Path $file -Encoding utf8
            "</updates>" | Add-Content -Path $file -Encoding utf8
          }

          # Load XML, prepend new item
          [xml]$doc = Get-Content $file
          $root = $doc.SelectSingleNode('/updates')
          $item = $doc.CreateElement('item')

          $ver = $doc.CreateElement('version'); $ver.InnerText = $version; $item.AppendChild($ver) | Out-Null
          $urln = $doc.CreateElement('url'); $urln.InnerText = $url; $item.AppendChild($urln) | Out-Null
          $chg = $doc.CreateElement('changelog'); $chg.InnerText = $changelog; $item.AppendChild($chg) | Out-Null

          if ($root.HasChildNodes) {
            $root.InsertBefore($item, $root.FirstChild) | Out-Null
          } else {
            $root.AppendChild($item) | Out-Null
          }
          $doc.Save($file)
          Write-Host "Update metadata written to $file"

      - name: Commit & push update/updates.xml to main
        uses: EndBug/add-and-commit@v9
        with:
          add: 'update/updates.xml'
          message: "Update metadata for ${{ needs.build.outputs.version }}"
          push: true
